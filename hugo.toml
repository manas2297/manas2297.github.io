baseURL = 'https://manas2297.github.io/'
locale = 'en-us'
title = 'Manas Yadav'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true # Allow HTML tags in markdown files (e.g. alignment divs, icons)
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = 'monokai' # Beautiful default code highlighter theme

[params]
  description = 'Professional portfolio for Manas Yadav: distributed systems, cloud infrastructure, and enterprise architecture case studies.'
  email = 'devxlog@zohomail.in'
  headerRole = 'Lead Engineer'
  headerCtaLabel = 'Email me'
  availabilityBadge = 'Open to lead, staff, and principal engineering roles'
  menuButtonLabel = 'Menu'
  copyrightLine = '© 2026 Manas Yadav'

  [params.hero]
    headline = 'Lead Engineer · Distributed systems & cloud platforms'
    lede = 'I architect high-throughput distributed backends and event-driven systems that scale 10x–100x — transforming complex infrastructure into cost-efficient, high-reliability platforms that directly accelerate business growth.'
    ctaPrimary = 'Get in touch'
    ctaSecondary = 'View case studies'
    portraitSrc = 'img/hero.png'
    portraitAlt = 'Manas Yadav — Lead Engineer'
    proofPoints = [
      '7+ years building scalable backends',
      '10x–100x system scaling & cost optimization',
      'Architecture from startups to global platforms',
    ]

  [params.philosophy]
    heading = 'The philosophy of structural intelligence'
    pullquote = 'Velocity gets attention, but reliability earns trust. The best architecture scales both product ambition and operational confidence.'

  [params.contact]
    eyebrow = 'Connect'
    title = "Let's build dependable systems"
    availabilityPrefix = 'Availability:'
    availabilityMessage = 'open to lead backend, distributed systems, and staff engineering roles'
    legal = 'Share your context and I will respond with a practical plan.'

