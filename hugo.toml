baseURL = 'https://manas2297.github.io/'
locale = 'en-us'
title = 'Manas Yadav'

# SEO: robots.txt (layouts/robots.txt points crawlers at the sitemap) and
# last-modified dates from git history (CI checks out with fetch-depth 0).
enableRobotsTXT = true
enableGitInfo = true

# Tags/categories are plain front matter used for cards, keywords and related
# posts. No layout exists for taxonomy pages, so don't generate thin,
# duplicate /tags/* and /categories/* pages.
disableKinds = ['taxonomy', 'term']

[frontmatter]
  lastmod = ['lastmod', ':git', 'date']

[sitemap]
  changeFreq = 'monthly'

# "Related articles" at the end of each post (.Site.RegularPages.Related).
[related]
  includeNewer = true
  threshold = 20
  toLower = true
  [[related.indices]]
    name = 'tags'
    weight = 100
  [[related.indices]]
    name = 'category'
    weight = 60

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true # Allow HTML tags in markdown files (e.g. alignment divs, icons)
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = 'github' # light theme to match the site's light code blocks

