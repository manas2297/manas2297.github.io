<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#00add8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="300" cy="180" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="420" cy="160" r="90" fill="#00add8" opacity="0.1" filter="url(#glow)"/>

  <!-- Code Window Mockup -->
  <g transform="translate(70, 45)">
    <!-- Window Container -->
    <rect width="460" height="270" rx="12" fill="#111520" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="460" height="40" rx="12" fill="#161b28"/>
    <rect y="28" width="460" height="12" fill="#161b28"/>
    <line x1="0" y1="40" x2="460" y2="40" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Traffic lights -->
    <circle cx="24" cy="20" r="5" fill="#ef4444"/>
    <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="20" r="5" fill="#10b981"/>
    
    <!-- Window Title -->
    <text x="230" y="24" fill="#8b93a7" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">producer.go — GoKafkaToolkit</text>
    
    <!-- Code Lines -->
    <text x="32" y="76" fill="#818cf8" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="600">package</text>
    <text x="96" y="76" fill="#f4f6fa" font-family="'Courier New', Courier, monospace" font-size="13">main</text>

    <text x="32" y="106" fill="#818cf8" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="600">import</text>
    <text x="90" y="106" fill="#34d399" font-family="'Courier New', Courier, monospace" font-size="13">"github.com/manas2297/GoKafkaToolkit"</text>

    <text x="32" y="146" fill="#c8ceda" font-family="'Courier New', Courier, monospace" font-size="12" opacity="0.6">// Initialize high-throughput producer pool</text>
    
    <text x="32" y="176" fill="#f4f6fa" font-family="'Courier New', Courier, monospace" font-size="13">client, err := gokafka.<tspan fill="#38bdf8">NewProducer</tspan>(&amp;gokafka.<tspan fill="#fbbf24">Config</tspan>{</text>
    <text x="56" y="202" fill="#e2e8f0" font-family="'Courier New', Courier, monospace" font-size="13">Brokers:    []<tspan fill="#818cf8">string</tspan>{<tspan fill="#34d399">"kafka:9092"</tspan>},</text>
    <text x="56" y="226" fill="#e2e8f0" font-family="'Courier New', Courier, monospace" font-size="13">BatchSize:  <tspan fill="#f472b6">65536</tspan>, <tspan fill="#64748b">// 64KB vector batch</tspan></text>
    <text x="56" y="250" fill="#e2e8f0" font-family="'Courier New', Courier, monospace" font-size="13">Acks:       <tspan fill="#f472b6">-1</tspan>,    <tspan fill="#64748b">// AllInSyncReplicas</tspan></text>
    <text x="32" y="274" fill="#f4f6fa" font-family="'Courier New', Courier, monospace" font-size="13">})</text>
  </g>
</svg>
