<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="stitchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#141a29"/>
    </linearGradient>
    <linearGradient id="stitchAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="threadGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#stitchBg)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
  </g>

  <!-- Central Visual: Floating Dashboard Card with Energy Tags & Thread Paths -->
  <g transform="translate(100, 50)">
    <!-- Dashboard Mockup Window -->
    <rect x="0" y="0" width="400" height="240" rx="14" fill="#131826" stroke="#252d42" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <rect x="0" y="0" width="400" height="36" rx="14" fill="#181f33" />
    <circle cx="22" cy="18" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="38" cy="18" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="54" cy="18" r="5" fill="#10b981" opacity="0.8"/>
    <text x="75" y="22" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#8b93a7" letter-spacing="0.05em">STITCH WORKSPACE // WAILS + GO</text>

    <!-- Energy Status Pills -->
    <g transform="translate(20, 52)">
      <!-- Low Energy -->
      <rect x="0" y="0" width="105" height="32" rx="8" fill="#1c2438" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="16" r="4" fill="#38bdf8"/>
      <text x="26" y="20" font-family="sans-serif" font-size="10" font-weight="600" fill="#94a3b8">LOW ENERGY</text>

      <!-- Medium Energy -->
      <rect x="115" y="0" width="115" height="32" rx="8" fill="#1c2438" stroke="#334155" stroke-width="1"/>
      <circle cx="129" cy="16" r="4" fill="#f59e0b"/>
      <text x="141" y="20" font-family="sans-serif" font-size="10" font-weight="600" fill="#94a3b8">MED ENERGY</text>

      <!-- High Energy -->
      <rect x="240" y="0" width="115" height="32" rx="8" fill="#241b38" stroke="#6366f1" stroke-width="1.2"/>
      <circle cx="254" cy="16" r="4" fill="#a855f7"/>
      <text x="266" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#e0e7ff">HIGH FOCUS</text>
    </g>

    <!-- Glowing Interconnected "Stitch" Threads -->
    <path d="M 60,130 C 130,100 180,180 250,140 S 330,190 360,150" fill="none" stroke="url(#threadGlow)" stroke-width="3" filter="url(#softGlow)"/>
    <path d="M 60,130 C 130,100 180,180 250,140 S 330,190 360,150" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

    <!-- Nodes / Repositories along the thread -->
    <g transform="translate(60, 130)">
      <circle cx="0" cy="0" r="14" fill="#1c2438" stroke="#6366f1" stroke-width="2"/>
      <path d="M -5,-5 L 5,5 M -5,5 L 5,-5" stroke="#818cf8" stroke-width="2"/>
    </g>
    <g transform="translate(200, 150)">
      <circle cx="0" cy="0" r="18" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
      <circle cx="0" cy="0" r="7" fill="#c084fc"/>
    </g>
    <g transform="translate(350, 150)">
      <circle cx="0" cy="0" r="14" fill="#1c2438" stroke="#ec4899" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#f472b6"/>
    </g>

    <!-- Repository Meta Line -->
    <text x="25" y="215" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">24 Repositories Tracked</text>
    <text x="250" y="215" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="500" fill="#6366f1">GitHub CLI Local Auth ✓</text>
  </g>
</svg>
