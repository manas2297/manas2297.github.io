<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <meta name="description" content="">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page">
    <div class="nav-overlay" id="nav-overlay" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" aria-label="Primary">
        <a href="#welcome" class="sidebar-brand">
            <span class="sidebar-brand__title" id="brand-sidebar-title"></span>
            <span class="sidebar-brand__meta" id="brand-sidebar-meta"></span>
        </a>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <p class="sidebar-watermark" id="brand-watermark" aria-hidden="true"></p>
        <p class="sidebar-est" id="brand-est"></p>
    </aside>

    <div class="shell">
        <header class="top-bar">
            <p class="top-bar__tagline" id="top-bar-tagline"></p>
            <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="sidebar">
                <span class="menu-btn__label" id="menu-btn-label">Menu</span>
                <span class="menu-btn__icon" aria-hidden="true">
                    <span></span><span></span><span></span>
                </span>
            </button>
        </header>

        <main class="main">
            <section class="hero reveal" id="welcome">
                <div class="hero__grid">
                    <div class="hero__copy" id="hero-copy"></div>
                    <div class="hero__visual">
                        <div class="hero__frame" id="hero-frame"></div>
                    </div>
                </div>
            </section>

            <section class="philosophy-block reveal" aria-labelledby="philosophy-heading">
                <div class="philosophy-block__grid">
                    <div class="philosophy-block__text" id="about">
                        <h2 id="philosophy-heading" class="section-head"></h2>
                        <div id="philosophy-body"></div>
                    </div>
                    <div class="service-grid" id="services"></div>
                </div>
            </section>

            <div class="marquee reveal" aria-hidden="true">
                <div class="marquee__track" id="marquee-track"></div>
            </div>

            <section class="showcase reveal" id="works" aria-labelledby="showcase-heading">
                <div class="showcase__bg" aria-hidden="true">
                    <span class="showcase__watermark showcase__watermark--works" id="showcase-wm-primary"></span>
                    <span class="showcase__watermark showcase__watermark--kinetic" id="showcase-wm-secondary"></span>
                </div>
                <div class="showcase__inner">
                    <header class="showcase__header">
                        <h2 id="showcase-heading" class="showcase__title"></h2>
                    </header>
                    <div class="showcase__filters" id="showcase-filters" role="tablist" aria-label="Project categories"></div>
                    <div class="showcase-grid" id="showcase-grid"></div>
                </div>
            </section>

            <section class="skills-hub reveal" id="skills" aria-labelledby="skills-heading">
                <div class="skills-hub__accent-rule" aria-hidden="true"></div>
                <h2 id="skills-heading" class="skills-hub__title"></h2>
                <div class="skill-rings" id="skill-rings" role="list"></div>

                <div class="journey">
                    <div class="journey__header" id="journey-header"></div>
                    <ol class="journey__list" id="journey-list"></ol>
                </div>

                <div class="credentials">
                    <h3 class="credentials__heading" id="credentials-heading"></h3>
                    <div class="credentials__grid" id="credentials-grid"></div>
                </div>

                <div class="skills-stats" id="skills-stats" aria-label="Career metrics"></div>
            </section>

            <section class="contact-protocol reveal" id="contact" aria-labelledby="contact-heading">
                <header class="contact-protocol__header">
                    <p class="contact-protocol__eyebrow" id="contact-eyebrow"></p>
                    <h2 id="contact-heading" class="contact-protocol__title"></h2>
                    <div class="contact-protocol__underline" aria-hidden="true"></div>
                </header>

                <div class="contact-protocol__grid">
                    <div class="contact-direct" id="contact-direct"></div>
                    <div class="contact-form-wrap" id="contact-form-wrap"></div>
                </div>
            </section>
        </main>

        <footer class="site-footer reveal">
            <p class="site-footer__copy" id="footer-copy"></p>
            <div class="site-footer__social" id="footer-social"></div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
